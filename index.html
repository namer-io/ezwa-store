<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>عِزوة EZWA | متجر الأزياء الذكية — NAMER-IO</title>
<meta name="description" content="متجر عِزوة (EZWA) للأزياء الرجالية الفاخرة المدمجة بتقنية NFC وتوثيق الملكية السحابي">
<meta name="theme-color" content="#0a0608">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EZWA Official">
<link rel="apple-touch-icon" href="ezwa-logo.png">
<link rel="icon" type="image/png" href="ezwa-logo.png">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Readex+Pro:wght@600;700&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
    --bg-void:#0a0608;
    --bg-burgundy:#1b090e;
    --gold-primary:#D4AF37;
    --gold-light:#f5d69c;
    --gold-matte:#b89228;
    --text-main:#ffffff;
    --store-width:min(480px,97vw);
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Tajawal',sans-serif;-webkit-tap-highlight-color:transparent;}
html[dir="ltr"] *{font-family:'Orbitron',sans-serif!important;}
body{
    background-color:var(--bg-void);
    color:var(--text-main);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    overflow-x:hidden;
    position:relative;
    padding:10px 0 96px 0;
}
body.entrance-locked{
    overflow:hidden;
    height:100dvh;
}

/* =========================================================================
   الواجهة الرئيسية التفاعلية (بنفس بنية العرض والأزرار الأربعة بهوية عِزوة)
   ========================================================================= */
.ezwa-entrance-overlay{
    position:fixed;
    inset:0;
    width:100vw;
    height:100dvh;
    background:#0a0608;
    z-index:3000;
    display:flex;
    justify-content:center;
    align-items:center;
    transition:opacity 0.55s cubic-bezier(0.16,1,0.3,1), transform 0.55s cubic-bezier(0.16,1,0.3,1);
}
.ezwa-entrance-overlay.dismissed{
    opacity:0;
    transform:scale(1.03);
    pointer-events:none;
}
.ezwa-holo-stage{
    position:relative;
    width:100vw;
    height:100dvh;
    background:linear-gradient(180deg, #1b090e 0%, #0a0608 55%, #12070a 100%);
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    justify-content:flex-start;
    align-items:center;
    padding:14px 16px 24px 16px;
    gap:10px;
    transition:box-shadow 0.25s ease;
}
.ezwa-holo-stage.drag-over{
    box-shadow:inset 0 0 0 2px var(--gold-light), 0 0 50px rgba(212,175,55,0.35);
}
@media (min-width: 768px) {
    .ezwa-holo-stage{
        width:480px;
        height:95dvh;
        border-radius:26px;
        box-shadow:0 0 70px rgba(212,175,55,0.16), inset 0 0 0 1px rgba(212,175,55,0.28);
    }
}

.hub-top-header{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    margin-top:28px;
}
.hub-crest-ring{
    width:72px;height:72px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, rgba(212,175,55,0.25) 0%, #0a0608 82%);
    border:1.8px solid var(--gold-primary);
    box-shadow:0 0 24px rgba(212,175,55,0.35);
    display:flex;align-items:center;justify-content:center;
    padding:8px;overflow:hidden;
    margin-bottom:6px;
}
.hub-crest-ring img{
    width:100%;height:100%;object-fit:contain;
    mix-blend-mode:lighten;pointer-events:none;
}
.hub-brand-name{
    font-family:'Readex Pro',sans-serif!important;
    font-size:20px;font-weight:700;
    color:var(--gold-light);
    letter-spacing:0.4px;
}
.hub-brand-sub{
    font-size:11px;color:#cbd5e1;font-weight:600;margin-top:2px;
}

.holo-projection-zone{
    position:relative;
    width:100%;
    height:min(275px, 36dvh);
    border-radius:18px;
    border:1.5px solid rgba(212,175,55,0.65);
    box-shadow:0 10px 28px rgba(0,0,0,0.75), 0 0 22px rgba(212,175,55,0.15);
    background:#050304;
    overflow:hidden;
    flex-shrink:0;
}
.holo-video{
    width:100%;height:100%;
    object-fit:cover;object-position:center 20%;
    display:block;transition:opacity 0.25s ease;
}
.holo-scanline{
    position:absolute;left:0;right:0;height:2px;
    background:linear-gradient(90deg, transparent, rgba(212,175,55,0.55), transparent);
    opacity:0.45;pointer-events:none;
    animation:holoScanMove 5.5s ease-in-out infinite;
}
@keyframes holoScanMove{
    0%{top:12%;opacity:0;}
    15%{opacity:0.5;}
    85%{opacity:0.5;}
    100%{top:82%;opacity:0;}
}
.hub-slide-arrow{
    position:absolute;top:50%;transform:translateY(-50%);
    width:32px;height:32px;border-radius:50%;
    background:rgba(10,6,8,0.72);
    border:1px solid rgba(212,175,55,0.55);
    color:var(--gold-light);font-size:18px;font-weight:900;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;z-index:5;
}
.hub-slide-arrow.prev-btn{right:8px;}
.hub-slide-arrow.next-btn{left:8px;}
.hub-screen-caption{
    position:absolute;bottom:9px;left:50%;transform:translateX(-50%);
    background:rgba(10,6,8,0.84);
    border:1px solid rgba(212,175,55,0.5);
    color:var(--gold-light);
    padding:3px 12px;border-radius:999px;
    font-size:10px;font-weight:800;white-space:nowrap;z-index:5;
}

.projector-base-wrap{
    width:100%;
    display:flex;flex-direction:column;align-items:center;
    gap:8px;margin-top:2px;
}
.hub-actions-title{
    font-size:11px;font-weight:800;color:var(--gold-light);
}
.entrance-cta-group{
    width:100%;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}
.btn-order-primary{
    width:100%;
    padding:12px 10px;
    border-radius:14px;
    background:linear-gradient(135deg, #f5d69c 0%, #D4AF37 55%, #b89228 100%);
    color:#0a0608;
    font-size:12.5px;font-weight:900;
    border:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:6px;
    box-shadow:0 6px 20px rgba(212,175,55,0.3);
    transition:transform 0.2s ease;
}
.btn-order-primary:active{transform:scale(0.97);}
.btn-enter-store{
    width:100%;
    padding:12px 10px;
    border-radius:14px;
    background:rgba(24,10,14,0.92);
    border:1.2px solid rgba(212,175,55,0.52);
    color:#f8fafc;
    font-size:12px;font-weight:800;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:6px;
    transition:all 0.2s ease;
}
.btn-enter-store:hover{
    border-color:var(--gold-light);
    color:var(--gold-light);
}

.sound-toggle{
    position:absolute;top:12px;left:12px;z-index:20;
    width:34px;height:34px;border-radius:50%;
    background:rgba(16,8,11,0.78);
    border:1px solid rgba(212,175,55,0.45);
    color:var(--gold-light);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
}
.local-video-pick-btn{
    position:absolute;top:12px;right:12px;z-index:20;
    height:34px;padding:0 12px;border-radius:999px;
    background:rgba(16,8,11,0.82);
    border:1px solid rgba(212,175,55,0.5);
    color:var(--gold-light);
    font-size:11px;font-weight:800;
    display:flex;align-items:center;gap:5px;
    cursor:pointer;transition:all 0.2s ease;
}
.local-video-pick-btn:hover{
    border-color:var(--gold-light);color:#ffffff;
}

/* =========================================================================
   تنسيقات المتجر الأساسي
   ========================================================================= */
.font-tech{font-family:'Orbitron',sans-serif!important;}
.cyber-backdrop{
    position:fixed;inset:0;z-index:-3;
    background:
        radial-gradient(circle at 50% 8%,rgba(212,175,55,0.14) 0%,transparent 52%),
        radial-gradient(circle at 18% 82%,rgba(136,34,60,0.22) 0%,transparent 50%),
        linear-gradient(180deg,#0a0608 0%,#16080d 50%,#0a0608 100%);
    pointer-events:none;
}
.cyber-grid-overlay{
    position:fixed;inset:0;z-index:-2;
    background-image:
        radial-gradient(rgba(212,175,55,0.11) 1px,transparent 1px),
        linear-gradient(to right,rgba(212,175,55,0.035) 1px,transparent 1px),
        linear-gradient(to bottom,rgba(212,175,55,0.035) 1px,transparent 1px);
    background-size:24px 24px,48px 48px,48px 48px;
    pointer-events:none;
}
#quantum-canvas{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none;}

.water-ripple-ring{position:fixed;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%) scale(0.1);border:1.5px solid rgba(212,175,55,0.85);box-shadow:0 0 12px rgba(212,175,55,0.35);z-index:9999;animation:waterRippleExpand 1s cubic-bezier(0.16,1,0.3,1) forwards;}
@keyframes waterRippleExpand{0%{width:10px;height:10px;opacity:0.95;transform:translate(-50%,-50%) scale(0.2);}100%{width:130px;height:130px;opacity:0;transform:translate(-50%,-50%) scale(1.2);}}

.store-shell{
    width:var(--store-width);
    display:flex;flex-direction:column;gap:10px;
    position:relative;z-index:10;
}

.top-telemetry-bar{
    position:sticky;top:8px;z-index:950;
    display:flex;align-items:center;justify-content:space-between;
    padding:7px 11px;
    background:rgba(16,8,11,0.92);
    backdrop-filter:blur(14px);
    border:1px solid rgba(212,175,55,0.45);
    box-shadow:0 8px 22px rgba(0,0,0,0.75);
    border-radius:20px;direction:ltr;
}
.portal-tag{font-family:'Orbitron',sans-serif;font-size:8.2px;font-weight:800;letter-spacing:0.8px;color:var(--gold-light);display:flex;align-items:center;gap:5px;cursor:pointer;}
.pulse-dot{width:6px;height:6px;border-radius:50%;background:#10b981;box-shadow:0 0 7px #10b981;animation:pingDot 1.8s infinite;}
@keyframes pingDot{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.4;transform:scale(1.3);}}
.top-actions{display:flex;align-items:center;gap:5px;}
.pill-mini-btn{background:rgba(22,9,13,0.95);border:1px solid rgba(212,175,55,0.45);color:var(--gold-light);padding:5px 9px;border-radius:12px;font-size:9.8px;font-weight:800;cursor:pointer;text-decoration:none;display:flex;align-items:center;gap:4px;transition:all 0.2s;white-space:nowrap;}
.pill-mini-btn.vip-gold{border-color:var(--gold-light);color:#0a0608;background:linear-gradient(135deg,var(--gold-light),var(--gold-matte));box-shadow:0 0 12px rgba(212,175,55,0.4);}
.pill-mini-btn:hover{transform:scale(1.03);}

.brand-holo-hero{
    display:flex;flex-direction:column;align-items:center;text-align:center;
    padding:4px 8px 0 8px;position:relative;
}
.ezwa-emblem-floater{
    display:flex;flex-direction:column;align-items:center;
    margin-bottom:4px;position:relative;
}
.ezwa-crest-orb{
    width:74px;height:74px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,rgba(212,175,55,0.22) 0%,rgba(10,6,8,0.95) 82%);
    border:1.8px solid var(--gold-matte);
    box-shadow:0 0 28px rgba(212,175,55,0.38);
    display:flex;align-items:center;justify-content:center;
    position:relative;overflow:hidden;padding:8px;
    animation:zeroGravityFloatA 3.8s ease-in-out infinite;
    margin-bottom:8px;
}
.ezwa-crest-orb img{width:100%;height:100%;object-fit:contain;mix-blend-mode:lighten;filter:contrast(1.15) brightness(1.08);pointer-events:none;}
.ezwa-crest-beam{width:60px;height:20px;margin-top:-10px;background:linear-gradient(to top,rgba(212,175,55,0.4) 0%,transparent 100%);clip-path:polygon(10% 0%,90% 0%,68% 100%,32% 100%);pointer-events:none;}
.ezwa-crest-pad{width:44px;height:8px;border-radius:50%;background:radial-gradient(ellipse at center,#D4AF37 0%,#14080a 75%);border:1.3px solid var(--gold-light);box-shadow:0 0 16px rgba(212,175,55,0.75);position:relative;}
.ezwa-crest-pad::after{content:'';position:absolute;inset:-5px;border-radius:50%;border:1px solid rgba(212,175,55,0.5);animation:emitterPulseRing 2.1s infinite;}

.ezwa-main-title{
    font-family:'Readex Pro',sans-serif!important;
    font-size:21px;font-weight:700;
    background:linear-gradient(180deg,#ffffff 20%,#f5d69c 68%,#c9a24b 100%);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    margin-top:3px;
}
.ezwa-sub-tagline{font-size:10.5px;color:#cbd5e1;font-weight:600;margin-top:2px;line-height:1.4;}
.retail-badge{
    display:inline-flex;align-items:center;gap:6px;margin-top:5px;padding:3px 13px;
    border-radius:20px;background:rgba(212,175,55,0.12);
    border:1px solid rgba(212,175,55,0.45);color:var(--gold-light);
    font-size:10px;font-weight:800;
}

.holo-categories-row{
    display:grid;grid-template-columns:repeat(2,1fr);
    align-items:end;justify-items:center;
    padding:2px 24px;width:100%;
}
.cat-holo-unit{
    width:100%;height:70px;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
    position:relative;cursor:pointer;user-select:none;
    transition:transform 0.2s ease;
}
.cat-holo-unit:active{transform:scale(0.92);}
.cat-cone{position:absolute;bottom:18px;width:42px;height:36px;clip-path:polygon(12% 0%,88% 0%,68% 100%,32% 100%);pointer-events:none;opacity:0.5;transition:opacity 0.25s;}
.cat-holo-unit.active .cat-cone{opacity:1;}
.cat-holo-unit.gold-t .cat-cone{background:linear-gradient(to top,rgba(212,175,55,0.45) 0%,transparent 100%);}
.cat-holo-unit.cyan-t .cat-cone{background:linear-gradient(to top,rgba(136,34,60,0.55) 0%,transparent 100%);}

.cat-pad{width:28px;height:6px;border-radius:50%;position:relative;transition:all 0.25s;}
.cat-holo-unit.gold-t .cat-pad{background:radial-gradient(ellipse at center,#D4AF37 0%,#14080a 75%);border:1.2px solid rgba(245,214,156,0.5);}
.cat-holo-unit.cyan-t .cat-pad{background:radial-gradient(ellipse at center,#D4AF37 0%,#14080a 75%);border:1.2px solid rgba(212,175,55,0.5);}
.cat-holo-unit.active .cat-pad{box-shadow:0 0 14px rgba(212,175,55,0.85);transform:scale(1.12);}

.cat-orb{
    width:38px;height:38px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    margin-bottom:7px;position:relative;
    background:rgba(20,9,12,0.9);
    border:1.3px solid rgba(212,175,55,0.28);
    transition:all 0.25s ease;
    animation:zeroGravityFloatA 3.6s ease-in-out infinite;
}
.cat-holo-unit:nth-child(2) .cat-orb{animation-delay:0.4s;}
.cat-holo-unit.active .cat-orb{border-color:var(--gold-light);box-shadow:0 0 18px rgba(212,175,55,0.6),inset 0 0 10px rgba(212,175,55,0.28);}

.cat-tag{margin-top:4px;font-size:9.2px;font-weight:700;color:#94a3b8;white-space:nowrap;transition:color 0.2s;}
.cat-holo-unit.active .cat-tag{color:var(--gold-light);text-shadow:0 0 8px rgba(212,175,55,0.45);}

.holo-products-grid{
    display:grid;grid-template-columns:1fr 1fr;
    gap:34px 4px;padding:18px 0 8px 0;width:100%;
}
.product-holo-stage{
    display:flex;flex-direction:column;align-items:center;text-align:center;
    position:relative;padding-top:26px;user-select:none;
}
.product-top-hud{
    position:absolute;top:0;left:8px;right:8px;
    display:flex;align-items:center;justify-content:space-between;
    z-index:8;pointer-events:none;
}
.nfc-micro-chip{
    background:rgba(16,8,11,0.92);
    border:1px solid rgba(212,175,55,0.55);
    color:var(--gold-light);
    font-family:'Orbitron',sans-serif!important;
    font-size:7px;font-weight:800;padding:2px 7px;border-radius:10px;
}
.zoom-micro-btn{
    background:rgba(16,8,11,0.92);
    border:1px solid rgba(212,175,55,0.65);
    color:var(--gold-light);
    width:23px;height:23px;border-radius:50%;font-size:11px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;pointer-events:auto;
}

.product-floater-visual{
    width:min(196px, 45vw);height:min(196px, 45vw);
    display:flex;align-items:center;justify-content:center;
    position:relative;z-index:3;cursor:zoom-in;
    animation:productZeroG 4.2s ease-in-out infinite;
    filter:drop-shadow(0 18px 22px rgba(0,0,0,0.9)) drop-shadow(0 0 16px rgba(212,175,55,0.2));
    transition:opacity 0.22s ease,transform 0.22s ease;
}
.product-floater-visual:active{transform:scale(0.95);}
.product-floater-visual.holo-flash{opacity:0.25;transform:scale(0.92);}
.product-holo-stage:nth-child(even) .product-floater-visual{animation-delay:0.7s;}
.product-floater-visual img{
    width:100%;height:100%;object-fit:contain;
    transform:scale(1.22);transform-origin:center bottom;
    mix-blend-mode:lighten;
    -webkit-mask-image:radial-gradient(ellipse 72% 84% at 50% 48%, #000 66%, transparent 98%);
    mask-image:radial-gradient(ellipse 72% 84% at 50% 48%, #000 66%, transparent 98%);
    pointer-events:none;
}
.product-floater-visual svg{width:162px;height:162px;pointer-events:none;}

.product-holo-beam{
    width:146px;height:36px;margin-top:-12px;
    background:linear-gradient(to top,rgba(212,175,55,0.34) 0%,transparent 100%);
    clip-path:polygon(8% 0%,92% 0%,72% 100%,28% 100%);
    pointer-events:none;z-index:2;animation:holoBeamFlicker 2.8s infinite alternate;
}
.product-holo-pad{
    width:100px;height:12px;border-radius:50%;
    background:radial-gradient(ellipse at center,#D4AF37 0%,#14080a 75%);
    border:1.3px solid var(--gold-light);
    box-shadow:0 0 18px rgba(212,175,55,0.72);
    position:relative;z-index:2;pointer-events:none;
}
.product-holo-pad::after{content:'';position:absolute;inset:-5px;border-radius:50%;border:1px solid rgba(212,175,55,0.45);animation:emitterPulseRing 2.2s infinite;}

.holo-swatch-row{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:8px;z-index:5;}
.holo-color-orb{width:18px;height:18px;border-radius:50%;border:1.5px solid rgba(255,255,255,0.35);cursor:pointer;transition:transform 0.2s,box-shadow 0.2s,border-color 0.2s;}
.holo-color-orb.active{transform:scale(1.25);border-color:var(--gold-light);box-shadow:0 0 12px rgba(212,175,55,0.8);}

.product-holo-meta{
    margin-top:6px;display:flex;flex-direction:column;align-items:center;gap:2px;
    cursor:pointer;padding:4px 6px;border-radius:14px;transition:background 0.2s;
}
.product-holo-meta:hover{background:rgba(212,175,55,0.08);}
.product-holo-name{font-size:12px;font-weight:800;color:#ffffff;line-height:1.3;}
.product-holo-bundle{font-size:9.2px;color:#cbd5e1;font-weight:600;}
.product-holo-price{margin-top:2px;font-size:12.5px;font-weight:900;color:var(--gold-light);}

@keyframes productZeroG{0%,100%{transform:translateY(0px) rotate(-1deg);}50%{transform:translateY(-8px) rotate(1deg);}}
@keyframes zeroGravityFloatA{0%,100%{transform:translateY(0px);}50%{transform:translateY(-6px);}}
@keyframes emitterPulseRing{0%{transform:scale(0.85);opacity:0.9;}100%{transform:scale(1.45);opacity:0;}}
@keyframes holoBeamFlicker{0%,100%{opacity:0.8;}50%{opacity:1;}75%{opacity:0.65;}}

.holo-verification-card{
    margin-top:16px;padding:14px 16px;
    background:linear-gradient(160deg,rgba(24,10,14,0.9) 0%,rgba(10,6,8,0.96) 100%);
    border:1px solid rgba(212,175,55,0.52);border-radius:18px;
    backdrop-filter:blur(12px);
    box-shadow:0 10px 26px rgba(0,0,0,0.6);
    display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.verif-info-col{text-align:start;flex:1;}
.verif-badge-top{display:inline-flex;align-items:center;gap:5px;color:var(--gold-light);font-size:12.5px;font-weight:800;margin-bottom:3px;}
.verif-sub-txt{font-size:10px;color:#cbd5e1;margin-bottom:6px;}
.verif-doc-num{font-size:11.5px;color:#e2e8f0;margin-bottom:9px;}
.verif-doc-num strong{color:var(--gold-primary);font-family:'Orbitron',sans-serif!important;letter-spacing:0.6px;}
.verif-check-btn{display:inline-block;padding:5px 13px;font-size:10.5px;font-weight:800;color:#0a0608;background:linear-gradient(135deg,var(--gold-light),var(--gold-matte));border-radius:10px;text-decoration:none;}

function formatNationalAddress(city, postal, street) {
    const parts = [];
    if (city) parts.push(city);

}

/* =========================================================================
   قائمة تشغيل الشاشة الرئيسية (Cloudinary) + دعم العرض المحلي من الجهاز
   ========================================================================= */
const entranceOverlay = document.getElementById('ezwaEntranceOverlay');
const entranceStage = document.getElementById('ezwaHoloStage');
const entranceVideo = document.getElementById('ezwaEntranceVideo');
const entranceSoundBtn = document.getElementById('entranceSoundBtn');
const entranceSoundIcon = document.getElementById('entranceSoundIcon');

const HOLO_PLAYLIST = [
    { src: "https://res.cloudinary.com/wdaldoah/video/upload/v1795791436/logo-reveal.mp4", label: "◈ هوية عِزوة الملكية • EZWA ◈" },
    { src: "https://res.cloudinary.com/wdaldoah/video/upload/v1795791409/video_1.mp4.mp4", label: "◈ تشكيلة المصمك • قصة بوكس فيت ◈" }
];
let currentVideoIndex = 0;

function playHubVideoAt(idx) {
    if (!HOLO_PLAYLIST.length || !entranceVideo) return;
    currentVideoIndex = (idx + HOLO_PLAYLIST.length) % HOLO_PLAYLIST.length;
    const item = HOLO_PLAYLIST[currentVideoIndex];
    entranceVideo.style.opacity = '0.25';
    setTimeout(() => {
        entranceVideo.src = item.src;
        entranceVideo.play().catch(() => {});
        entranceVideo.style.opacity = '1';
        const lbl = document.getElementById('hubScreenLabel');
        if (lbl) lbl.innerText = item.label || '◈ إصدارات عِزوة المحدودة ◈';
    }, 150);
}

function switchHubSlide(delta) { playHubVideoAt(currentVideoIndex + delta); }

function applyLocalEntranceFiles(fileList) {
    const videos = Array.from(fileList).filter(f => f.type.startsWith('video/'));
    if (!videos.length) return;
    const localItems = videos.map((file, i) => ({ src: URL.createObjectURL(file), label: `◈ عرض محلي (${i + 1}/${videos.length}) ◈` }));
    HOLO_PLAYLIST.length = 0;
    HOLO_PLAYLIST.push(...localItems);
    playHubVideoAt(0);
    showToast(`تم تشغيل ${videos.length} فيديو من جهازك ◈`);
}

function loadLocalEntranceVideos(event) { applyLocalEntranceFiles(event.target.files); }

if (entranceStage) {
    entranceStage.addEventListener('dragover', (e) => { e.preventDefault(); entranceStage.classList.add('drag-over'); });
    entranceStage.addEventListener('dragleave', () => { entranceStage.classList.remove('drag-over'); });
    entranceStage.addEventListener('drop', (e) => {
        e.preventDefault();
        entranceStage.classList.remove('drag-over');
        if (e.dataTransfer && e.dataTransfer.files.length) applyLocalEntranceFiles(e.dataTransfer.files);
    });
}

HOLO_PLAYLIST.forEach((item, index) => {
    if (index > 0) {
        const preloader = document.createElement('link');
        preloader.rel = 'preload'; preloader.as = 'video'; preloader.href = item.src;
        document.head.appendChild(preloader);
    }
});

if (entranceVideo) {
    entranceVideo.src = HOLO_PLAYLIST[0].src;
    entranceVideo.loop = false;
    const lbl = document.getElementById('hubScreenLabel');
    if (lbl) lbl.innerText = HOLO_PLAYLIST[0].label;
    entranceVideo.addEventListener('ended', () => playHubVideoAt(currentVideoIndex + 1));
}

        entranceSoundIcon.innerHTML = entranceVideo.muted

    });
}

function enterHoloStore() {
    if (entranceVideo) entranceVideo.pause();

/* =========================================================================
   الزر الثاني: توقيع الزوار وسجل التقييمات
   ========================================================================= */
let guestbookEntries = [
    { name: "عبدالرحمن السبيعي", rating: "★★★★★", note: "خامة البوكس فيت البرغندي فخمة جداً، وفكرة الـ NFC في السدو السفلي مميزة.", date: "2026-11-20", sig: "" },
    { name: "فيصل القحطاني", rating: "★★★★★", note: "تغليف البرواز كهدية كان مبهر، والتعامل راقي وسريع.", date: "2026-11-24", sig: "" }
];
try { const rawGb = localStorage.getItem('ezwa_guestbook_v1'); if (rawGb) guestbookEntries = JSON.parse(rawGb); } catch(e) {}

let sigCanvasInitialized = false, sigHasStroke = false;

function initVisitorSigCanvas() {
    if (sigCanvasInitialized) return;
    const c = document.getElementById('visitorSigCanvas');
    if (!c) return;
    const sctx = c.getContext('2d');
    sctx.strokeStyle = '#f5d69c'; sctx.lineWidth = 2.4; sctx.lineCap = 'round'; sctx.lineJoin = 'round';
    let drawing = false;
    function getPos(e) {
        const rect = c.getBoundingClientRect();
        const cx = e.touches ? e.touches[0].clientX : e.clientX;
        const cy = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: (cx - rect.left) * (c.width / rect.width), y: (cy - rect.top) * (c.height / rect.height) };
    }
    function startDraw(e) { e.preventDefault(); drawing = true; sigHasStroke = true; const p = getPos(e); sctx.beginPath(); sctx.moveTo(p.x, p.y); }
    function moveDraw(e) { if (!drawing) return; e.preventDefault(); const p = getPos(e); sctx.lineTo(p.x, p.y); sctx.stroke(); }
    function endDraw() { drawing = false; }
    c.addEventListener('mousedown', startDraw); c.addEventListener('mousemove', moveDraw); window.addEventListener('mouseup', endDraw);
    c.addEventListener('touchstart', startDraw, { passive: false }); c.addEventListener('touchmove', moveDraw, { passive: false }); c.addEventListener('touchend', endDraw);
    sigCanvasInitialized = true;
}

function clearVisitorSignature() {
    const c = document.getElementById('visitorSigCanvas');
    if (!c) return;
    c.getContext('2d').clearRect(0, 0, c.width, c.height);
    sigHasStroke = false;
}

function renderGuestbookList() {
    const feed = document.getElementById('guestbookFeed');
    if (!feed) return;
    feed.innerHTML = guestbookEntries.map(item => `
        <div class="guest-entry-card">
            <div class="guest-entry-head"><span>${item.name}</span><span style="color:#D4AF37;">${item.rating}</span></div>
            ${item.note ? `<div style="font-size:11px;color:#e2e8f0;line-height:1.5;">${item.note}</div>` : ''}
            ${item.sig ? `<img src="${item.sig}" alt="توقيع ${item.name}" class="guest-sig-preview">` : ''}
            <div style="font-size:9px;color:#94a3b8;margin-top:3px;">${item.date}</div>
        </div>
    `).join('');
}

function openGuestbookModal() { document.getElementById('guestbookModal').classList.add('active'); initVisitorSigCanvas(); renderGuestbookList(); }

function saveVisitorGuestbook() {
    const name = document.getElementById('gbNameInput').value.trim();
    const rating = document.getElementById('gbRatingSelect').value;
    const note = document.getElementById('gbNoteInput').value.trim();
    if (!name) { showToast('يرجى كتابة اسمك الكريم أولاً'); return; }
    const c = document.getElementById('visitorSigCanvas');
    const sigData = (c && sigHasStroke) ? c.toDataURL('image/png') : '';
    guestbookEntries.unshift({ name, rating, note, date: new Date().toLocaleDateString('ar-SA'), sig: sigData });
    try { localStorage.setItem('ezwa_guestbook_v1', JSON.stringify(guestbookEntries)); } catch(e) {}
    document.getElementById('gbNameInput').value = ''; document.getElementById('gbNoteInput').value = '';
    clearVisitorSignature(); renderGuestbookList();
    showToast('تم حفظ توقيعك وتقييمك في سجل الزوار ◈');
}

async function submitCustomApparelOrder(e) {

function speakAiVoice(plainText) {
    if (isVoiceMuted || !('speechSynthesis' in window)) return;
    try {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(plainText);
        utter.lang = currentLang === 'ar' ? 'ar-SA' : 'en-US'; utter.rate = 0.98; utter.pitch = 1.02;
        const waveEl = document.getElementById('voiceWaveBars');
        utter.onstart = () => { if (waveEl) waveEl.classList.add('speaking'); };
        utter.onend = () => { if (waveEl) waveEl.classList.remove('speaking'); };
        utter.onerror = () => { if (waveEl) waveEl.classList.remove('speaking'); };
        window.speechSynthesis.speak(utter);
    } catch (e) {}
}

function stopAiVoice() {
    try { if ('speechSynthesis' in window) window.speechSynthesis.cancel(); const waveEl = document.getElementById('voiceWaveBars'); if (waveEl) waveEl.classList.remove('speaking'); } catch (e) {}
}

function startVoiceRecognition() {

    if (!SpeechRec) { showToast('المتصفح لا يدعم المايكروفون، استخدم الأزرار السريعة'); return; }
    stopAiVoice();
    const rec = new SpeechRec(); rec.lang = currentLang === 'ar' ? 'ar-SA' : 'en-US';
    const btn = document.getElementById('micSpeakBtn'), lbl = document.getElementById('micBtnLabel');
    rec.onstart = () => { btn.classList.add('listening'); lbl.innerText = 'أستمع إليك الآن...'; };

    rec.onend = () => { btn.classList.remove('listening'); lbl.innerText = 'تحدّث بصوتك'; };
    rec.start();

function handleSpokenQuery(text) {
    const q = text.toLowerCase();
    if (q.includes('أضف') || q.includes('اضف') || q.includes('ابي') || q.includes('أبي') || q.includes('اطلب') || q.includes('تيشيرت') || q.includes('المصمك') || q.includes('برغندي') || q.includes('أسود') || q.includes('اسود')) {
        let targetProd = PRODUCTS[0];
        if ((q.includes('أسود') || q.includes('اسود')) && (q.includes('أمامي') || q.includes('امامي') || q.includes('ezwa'))) targetProd = PRODUCTS.find(p => p.id === 'ezwa-masmak-black-front') || targetProd;
        else if (q.includes('أسود') || q.includes('اسود')) targetProd = PRODUCTS.find(p => p.id === 'ezwa-masmak-black-back') || targetProd;
        else if (q.includes('أمامي') || q.includes('امامي') || q.includes('ezwa')) targetProd = PRODUCTS.find(p => p.id === 'ezwa-masmak-burgundy-front') || targetProd;
        else targetProd = PRODUCTS.find(p => p.id === 'ezwa-masmak-burgundy-back') || targetProd;

        let chosenSize = 'L';
        if (q.includes('سمول') || q.includes('small')) chosenSize = 'S';
        else if (q.includes('ميديم') || q.includes('وسط')) chosenSize = 'M';
        else if (q.includes('اكس لارج') || q.includes('إكس لارج') || q.includes('xl')) chosenSize = 'XL';

        const activeVar = targetProd.variants[0], cartKey = `${targetProd.id}__0__${chosenSize}`;
        const existing = cart.find(i => i.cartKey === cartKey);
        if (existing) existing.qty += 1;
        else cart.push({ cartKey, id: targetProd.id, nameAr: targetProd.nameAr, nameEn: targetProd.nameEn, colorAr: activeVar.colorAr, colorEn: activeVar.colorEn, size: chosenSize, price: targetProd.price, qty: 1 });
        updateCartUI();
        const reply = `تمت إضافة <strong>${targetProd.nameAr}</strong> مقاس <strong style="color:#f5d69c;">${chosenSize}</strong> إلى سلتك مباشرة!`;
        appendAiChat(text, reply); speakAiVoice(`تمت إضافة ${targetProd.nameAr} مقاس ${chosenSize} إلى سلتك بنجاح.`);
        return;
    }
    if (q.includes('مقاس') || q.includes('طول') || q.includes('وزن')) {
        document.getElementById('sizeCalcBox').classList.add('active');
        const reply = 'أدخل طولك ووزنك واختر نوع القصة وسأحسب مقاسك فوراً.';
        appendAiChat(text, reply); speakAiVoice(reply);
    } else if (q.includes('nfc') || q.includes('شريحة')) askAiTopic('nfc', text);
    else if (q.includes('برواز') || q.includes('غسيل')) askAiTopic('frame', text);
    else askAiTopic('outfit', text);
}

}

function renderVariantVisual(prod, varIdx) {

    const fallbackSvg = getHologramSvg(prod.cat, v).replace(/"/g, "'");
    if (v.image && v.image.trim() !== '') return `<img src="${v.image}" alt="${prod.nameAr}" onerror="this.outerHTML=\`${fallbackSvg}\`">`;

}

    document.getElementById('cartCountBadge').innerText = totalItems;
    document.getElementById('cartOrbPrice').innerText = `${totalAmount} ${curr}`;
    document.getElementById('cmGrandTotal').innerText = `${totalAmount} ${curr}`;
    refreshBankQrCodes(totalAmount);
}

function openCartModal() {
    const c = document.getElementById('cartItemsContainer'), curr = currentLang === 'ar' ? STORE_CONFIG.currencyAr : STORE_CONFIG.currencyEn;
    c.innerHTML = cart.length === 0
        ? `<p style="text-align:center;color:#94a3b8;font-size:12px;padding:16px 0;">السلة فارغة حالياً</p>`
        : cart.map((it, idx) => `<div class="cart-item-row"><div class="cart-item-info"><span class="cart-item-name">${it.nameAr} (${it.colorAr} • ${it.size})</span><span class="cart-item-sub">${it.qty} × ${it.price} ${curr} = ${it.qty * it.price} ${curr}</span></div><button type="button" class="del-item-btn" onclick="removeCartItem(${idx})">✕</button></div>`).join('');
    toggleBankTransferDetails(); updateCartUI(); document.getElementById('cartModal').classList.add('active');
}
function removeCartItem(i) { cart.splice(i, 1); openCartModal(); }

async function submitDirectStoreOrder() {
    if (cart.length === 0) { showToast('أضف قطعة واحدة على الأقل أولاً'); return; }
    const clientName = document.getElementById('merchantNameInput').value.trim();
    const clientPhone = document.getElementById('clientPhoneInput').value.trim();
    const clientCity = document.getElementById('clientCityInput').value.trim();
    const nationalPostal = document.getElementById('nationalPostalInput').value.trim();
    const nationalStreet = document.getElementById('nationalStreetInput').value.trim();
    const fullAddress = formatNationalAddress(clientCity, nationalPostal, nationalStreet);
    const paymentMethod = document.getElementById('paymentMethodSelect').value;
    const transferRef = document.getElementById('transferRefInput').value.trim();
    const pkg = document.getElementById('packagingOption').value;
    const refCode = document.getElementById('referralInputCode').value.trim();
    if (!clientName || !clientPhone || !clientCity) { showToast('يرجى إدخال الاسم والجوال والمدينة'); return; }

    const btn = document.getElementById('submitOrderBtn'); btn.disabled = true;
    const invoiceNo = 'EZ-' + Math.floor(100000 + Math.random() * 900000), todayStr = new Date().toLocaleDateString('ar-SA');
    const totalItems = cart.reduce((s, i) => s + i.qty, 0), totalPrice = cart.reduce((s, i) => s + (i.price * i.qty), 0);
    const paymentLabel = transferRef ? `${paymentMethod} (مرجع: ${transferRef})` : paymentMethod;
    const orderRecord = { invoiceNo, date: todayStr, clientName, clientPhone, clientCity, nationalPostal, nationalStreet, fullAddress, paymentMethod: paymentLabel, isBankTransfer: paymentMethod.includes('تحويل بنكي'), packaging: pkg, referral: refCode || 'لا يوجد', items: JSON.parse(JSON.stringify(cart)), totalItems, totalPrice };

    try {
        await fetch(STORE_CONFIG.formspreeEndpoint, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            body: JSON.stringify({ _subject: `طلب عِزوة (${invoiceNo}) - ${clientName}`, رقم_الفاتورة: invoiceNo, اسم_العميل: clientName, رقم_الجوال: clientPhone, العنوان_الوطني: fullAddress, طريقة_الدفع: paymentLabel, التغليف: pkg, الإجمالي_النهائي: `${totalPrice} ر.س` })
        });
    } catch (e) {}

    savedOrders.unshift(orderRecord);
    try { localStorage.setItem('ezwa_store_orders_v1', JSON.stringify(savedOrders)); } catch(e) {}
    vipData.pieces += totalItems; vipData.name = clientName;
    try { localStorage.setItem('ezwa_vip_member_v1', JSON.stringify(vipData)); } catch(e) {}

    cart = []; updateCartUI(); btn.disabled = false; closeModal('cartModal'); showGeneratedInvoice(orderRecord);
}

function showGeneratedInvoice(order) {
    refreshBankQrCodes(order.totalPrice);
    document.getElementById('invNumberTag').innerText = '#' + order.invoiceNo;
    document.getElementById('invDateTag').innerText = order.date;
    document.getElementById('invClientName').innerText = order.clientName;
    document.getElementById('invClientPhone').innerText = order.clientPhone;
    document.getElementById('invClientAddressFull').innerText = order.fullAddress || '-';
    document.getElementById('invPackaging').innerText = order.packaging;
    document.getElementById('invPaymentMethod').innerText = order.paymentMethod || 'تحويل بنكي (الراجحي)';
    document.getElementById('invBankSummaryRow').style.display = (order.isBankTransfer !== false) ? 'flex' : 'none';
    document.getElementById('invGrandTotalVal').innerText = order.totalPrice + ' ر.س';
    document.getElementById('invItemsTbody').innerHTML = order.items.map(item => `<tr><td>${item.nameAr} (${item.size})</td><td>${item.qty}</td><td>${item.qty * item.price} ر.س</td></tr>`).join('');
    document.getElementById('invWaShareBtn').onclick = () => {
        const msg = `*فاتورة عِزوة* #${order.invoiceNo}\nالعميل: ${order.clientName}\nالعنوان الوطني: ${order.fullAddress}\nالدفع: ${order.paymentMethod}\nالإجمالي: ${order.totalPrice} ر.س`;
        window.open(`https://wa.me/${STORE_CONFIG.whatsappNumber}?text=${encodeURIComponent(msg)}`, '_blank');
    };
    document.getElementById('invoiceModal').classList.add('active');
}

function openPinModal() { document.getElementById('adminPinInput').value = ''; document.getElementById('pinErr').style.display = 'none'; document.getElementById('pinModal').classList.add('active'); }
function verifyAdminPin(e) {
    e.preventDefault();
    if (document.getElementById('adminPinInput').value.trim() === STORE_CONFIG.adminPin) {
        closeModal('pinModal'); renderAdminOrdersList(); renderAdminProductsList(); switchAdminTab('orders'); document.getElementById('adminModal').classList.add('active');
    } else document.getElementById('pinErr').style.display = 'block';
}
function switchAdminTab(tab) { document.getElementById('adminOrdersTab').style.display = tab === 'orders' ? 'block' : 'none'; document.getElementById('adminProductsTab').style.display = tab === 'products' ? 'block' : 'none'; }
function renderAdminOrdersList() {
    document.getElementById('adminOrdersList').innerHTML = savedOrders.length === 0 ? `<div style="text-align:center;color:#94a3b8;font-size:11px;padding:12px;">لا توجد طلبات محلية بعد.</div>`
        : savedOrders.map((ord, idx) => `<div class="admin-prod-item" style="flex-direction:column;align-items:stretch;gap:4px;"><div style="display:flex;justify-content:space-between;"><strong>#${ord.invoiceNo}</strong><span>${ord.totalPrice} ر.س</span></div><div style="font-size:10.5px;">${ord.clientName} — ${ord.fullAddress || ''}</div><button type="button" class="pill-mini-btn vip-gold" onclick="viewSavedOrderInvoice(${idx})">🧾 عرض الفاتورة</button></div>`).join('');
}
function viewSavedOrderInvoice(idx) { const ord = savedOrders[idx]; if (ord) { closeModal('adminModal'); showGeneratedInvoice(ord); } }
function renderAdminProductsList() {
    document.getElementById('adminProductsList').innerHTML = PRODUCTS.map((p, idx) => `<div class="admin-prod-item"><div><div style="font-weight:800;">${p.nameAr}</div><div style="font-size:10px;color:var(--gold-light);">${p.price} ر.س</div></div><button type="button" class="del-item-btn" onclick="deleteProduct(${idx})">حذف</button></div>`).join('');
}
function addNewProduct(e) {
    e.preventDefault();
    PRODUCTS.unshift({ id: 'ezwa-' + Date.now(), cat: 'tshirts', nameAr: document.getElementById('npName').value.trim(), nameEn: document.getElementById('npName').value.trim(), price: Number(document.getElementById('npPrice').value), sizes: document.getElementById('npSizes').value.split(',').map(s => s.trim()).filter(Boolean), descAr: "قصة بوكس فيت مدمج بـ NFC • قطن 100 %", descEn: "Box Fit • NFC • 100% Cotton", variants: [{ colorAr: document.getElementById('npColorName').value.trim() || 'برغندي', colorEn: 'Burgundy', swatch: '#D4AF37', bodyHex: '#111827', image: document.getElementById('npImg').value.trim() }] });
    try { localStorage.setItem('ezwa_retail_products_v11', JSON.stringify(PRODUCTS)); } catch(e) {}
    renderProducts(); renderAdminProductsList(); e.target.reset(); showToast('تمت إضافة القطعة ◈');
}
function deleteProduct(idx) { PRODUCTS.splice(idx, 1); try { localStorage.setItem('ezwa_retail_products_v11', JSON.stringify(PRODUCTS)); } catch(e) {} renderProducts(); renderAdminProductsList(); }
function exportUpdatedHtmlCode() { navigator.clipboard.writeText('<!DOCTYPE html>\n' + document.documentElement.outerHTML).then(() => showToast('تم نسخ الكود المحدّث ◈')); }

function toggleLang() {
    currentLang = currentLang === 'ar' ? 'en' : 'ar';
    document.documentElement.setAttribute('dir', currentLang === 'ar' ? 'rtl' : 'ltr');
    document.getElementById('langBtn').innerText = currentLang === 'ar' ? 'EN' : 'عربي';
    renderProducts(); updateCartUI();
}
function closeModal(id) { document.getElementById(id).classList.remove('active'); }
function showToast(msg) { const t = document.getElementById('toastBox'); t.innerText = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000); }

document.addEventListener('pointerdown', e => {
    const r = document.createElement('div'); r.className = 'water-ripple-ring'; r.style.left = e.clientX + 'px'; r.style.top = e.clientY + 'px';
    document.body.appendChild(r); setTimeout(() => r.remove(), 1050);
});

const canvas = document.getElementById('quantum-canvas'), ctx = canvas.getContext('2d');
let particles = [];
function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resizeCanvas); resizeCanvas();
for (let i = 0; i < 24; i++) particles.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, r: Math.random() * 1.3 + 0.4, vx: (Math.random() - 0.5) * 0.22, vy: (Math.random() - 0.5) * 0.22, gold: Math.random() > 0.35 });
function animateParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0 || p.x > canvas.width) p.vx *= -1; if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = p.gold ? 'rgba(212,175,55,0.65)' : 'rgba(136,34,60,0.55)'; ctx.fill();
    });
    requestAnimationFrame(animateParticles);
}
animateParticles();

window.onload = function() { renderProducts(); updateCartUI(); };
</script>
